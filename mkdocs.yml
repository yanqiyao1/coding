# =============================================================================
#  Coding 笔记 · MkDocs Material 配置
#  本地预览:  make serve      (或 .venv/bin/mkdocs serve)
#  构建产物:  site/           (CI 会自动构建并发布到 GitHub Pages)
# =============================================================================

site_name: Coding 笔记
site_url: https://yanqiyao1.github.io/coding/
site_description: 严棋耀的编程笔记 —— Python、C++、算法与 LLM 手撕代码
site_author: 严棋耀 Qiyao Yan
repo_url: https://github.com/yanqiyao1/coding
repo_name: yanqiyao1/coding
edit_uri: edit/main/docs/
copyright: © 2026 严棋耀 · <a href="/coding/feed.xml">RSS</a> · MkDocs Material

# ----------------------------------------------------------------- 主题
theme:
  name: material
  language: zh
  custom_dir: overrides
  favicon: assets/favicon.svg
  font: false            # 不加载 Google Fonts：中文字体走系统字体，国内访问也快
  icon:
    logo: material/code-tags
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

# ----------------------------------------------------------------- 导航
nav:
  - 首页: index.md
  - Python:
      - python/index.md
      - 基础: python/basics/index.md
      - PyTorch: python/pytorch/index.md
      - LLM 项目: python/llm-projects/index.md
  - C++:
      - cpp/index.md
      - 基础: cpp/basics/index.md
      - 进阶: cpp/advanced/index.md
  - 算法: algo/index.md
  - LLM 手撕: llm-coding/index.md
  - LLM 方向:
      - llm/index.md
      - 强化学习: llm/rl/index.md
      - 后训练: llm/post-training/index.md
      - Code Agent: llm/code-agent/index.md
  - 标签: tags.md
  - 关于: about/index.md

# ----------------------------------------------------------------- 插件
hooks:
  - hooks/rss.py

plugins:
  - search:
      lang:
        - zh
        - en
  - tags:
      listings_layout: default

# ----------------------------------------------------------------- Markdown
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-chart
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ----------------------------------------------------------------- 资源
extra_css:
  - assets/katex/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  # mermaid.min.js 由 init 脚本按需加载，没图表的页面不会下载它
  - javascripts/mermaid-init.js
  # 数学公式：KaTeX 本地化，不依赖 CDN
  - assets/katex/katex.min.js
  - assets/katex/auto-render.min.js
  - javascripts/katex.js
  - javascripts/read-progress.js
  - javascripts/theme-default.js
  - javascripts/code-label.js
  - javascripts/post-meta.js
  - javascripts/search-hotkey.js
  - javascripts/back-to-top.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yanqiyao1
      name: GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:yqy.1@foxmail.com
      name: 邮箱
    - icon: fontawesome/solid/house
      link: https://yanqiyao1.github.io/
      name: 个人主页
  generator: false

# ----------------------------------------------------------------- 构建
use_directory_urls: true
strict: true
